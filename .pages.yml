# Pages CMS settings: turns this repo into a simple admin panel for the blog.
# Sign in at https://app.pagescms.org with GitHub, pick this repo, and use "Blog posts".

media:
  input: assets
  output: /myporfolio/assets

content:
  - name: posts
    label: Blog posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, summary]
      primary: title
      sort: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: summary
        label: Short summary (shown on the post card)
        type: text
      - name: tags
        label: Tags
        type: string
        list: true
      - name: body
        label: Post
        type: rich-text
