# Pages CMS settings: turns this repo into a simple admin panel for the blog.
# Sign in at https://app.pagescms.org with GitHub, pick this repo, and use "Blog posts".

media:
  input: assets
  output: /assets

content:
  - name: posts
    label: Blog posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, summary, published]
      primary: title
      sort: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: summary
        label: Short summary (shown on the post card)
        type: text
      - name: image
        label: Cover picture (shown on the card and at the top of the post)
        type: image
      - name: tags
        label: Tags
        type: string
        list: true
      - name: published
        label: Publish this post (switch off to save it as a private draft)
        type: boolean
        default: true
      - name: body
        label: Post (use the picture button to add photos inside the post)
        type: rich-text
